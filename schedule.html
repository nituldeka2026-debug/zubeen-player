<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zubeen Radio — Schedule</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 15%,#5d2e20,#130d0b 60%);color:#eee4dd;font-family:Georgia,serif;min-height:100vh}.wrap{width:min(900px,90vw);margin:auto;padding:70px 0}.back{font:11px monospace;color:#d5b08b;text-decoration:none}.kicker{font:10px monospace;letter-spacing:2px;color:#bda79a;margin-top:60px}.hero{display:flex;justify-content:space-between;align-items:end;gap:30px}.hero h1{font-size:46px;font-weight:500;margin:8px 0}.hero p{font:10px monospace;color:#9b8980;letter-spacing:1px}.now{border:1px solid #9a7047;border-radius:18px;padding:12px 16px;font:10px monospace;color:#d8aa72}.now b{color:#f05c43}.timeline{margin-top:45px}.row{display:grid;grid-template-columns:125px 1fr;gap:28px;padding:24px 18px;border-bottom:1px solid rgba(255,255,255,.1);border-radius:15px}.row.active{border:1px solid #b57a40;background:rgba(170,105,51,.12);box-shadow:0 10px 35px rgba(0,0,0,.2)}.time{font:11px monospace;color:#a18d81}.title{font-size:23px}.assam{font-size:12px;color:#a8968b;margin-top:6px}.desc{font-size:12px;color:#8c7d75;margin-top:12px;line-height:1.7}.remain{font:8px monospace;color:#8f7d73;margin-top:8px}.note{margin:45px 18px;font:9px monospace;color:#7e7069;line-height:1.8}@media(max-width:600px){.hero{display:block}.hero h1{font-size:35px}.now{display:inline-block;margin-top:10px}.row{grid-template-columns:1fr;gap:8px}.time{font-size:9px}.title{font-size:20px}}
</style></head><body><div class="wrap"><a class="back" href="/">← BACK TO RADIO</a><div class="kicker">THE DAY, IN FIVE PARTS</div><div class="hero"><div><h1>The day, in five parts</h1><p>ALL TIMES IST · ASSAM · GROUNDED ON THE RIVER</p></div><div class="now" id="now"></div></div><div class="timeline" id="timeline"></div><div class="note">There is nothing to click here. You can't pick a song or skip one — the clock in Guwahati decides what everyone is hearing right now on the same track.</div></div><script>
const rows=[['00:00','08:00','Borgeet, Lokgeet & Bhakti','ভক্তি, গীতিকবিতা আৰু লোকগীত','Quiet, rich, soulful. Saturdays before sunrise, folk as the light comes.'],['08:00','11:00','Bihu & High Energy','বিহু আৰু উচ্ছল গীত','Dhol, pepa, rogori. The morning belongs to the fields.'],['11:00','17:00','Assamese Modern Classics','অসমীয়া আধুনিক ক্লাছিক','Anamika, Mayabini, Maya — the songs that raised a generation.'],['17:00','21:00','Bollywood Nostalgia','বলিউড নষ্টালজিয়া','The playback years, when the rest of the country learned his voice.'],['21:00','00:00','Midnight Melodies','মাজনিশাৰ সুৰ','Slow, soulful, unhurried. For the ones still awake.']];
function current(){let m=new Date().getHours()*60+new Date().getMinutes();return m<480?0:m<660?1:m<1020?2:m<1260?3:4}function render(){let i=current(),d=new Date();document.getElementById('now').innerHTML='● <b>ON AIR</b> · '+rows[i][2]+'<br><span style="color:#8d7d75">'+d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})+'</span>';document.getElementById('timeline').innerHTML=rows.map((r,n)=>`<div class="row ${n===i?'active':''}"><div class="time">${r[0]} – ${r[1]}</div><div><div class="title">${r[2]} ${n===i?'<span style="font:9px monospace;color:#e9573b">● ON AIR</span>':''}</div><div class="assam">${r[3]}</div><div class="desc">${r[4]}</div><div class="remain">${n===i?'ON AIR · THE CLOCK DECIDES WHAT COMES NEXT':'00 TRACKS · RUNS AGAIN WHEN THE DAY COMES ROUND'}</div></div></div>`).join('')}render();setInterval(render,30000);
</script></body></html>
