<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zubeen Radio Admin</title><link rel="stylesheet" href="/style.css"></head><body><main style="padding:55px 0"><a href="/" style="color:#d7b07a;font-size:8px">← Radio</a><h1>Radio Admin</h1><p style="font-size:8px;color:#a89387">Songs are discovered automatically. This page is only for checking the catalog.</p><div id="health" class="strip">Loading…</div><div id="songs"></div></main><script>async function load(){const h=await fetch('/api/health').then(r=>r.json());document.getElementById('health').innerHTML=`YouTube API: <b>${h.youtubeConfigured?'ON':'OFF — fallback songs still work'}</b> • Catalog: ${h.catalogCount} • Listeners: ${h.listeners}`;const s=await fetch('/api/admin/songs').then(r=>r.json());document.getElementById('songs').innerHTML=(s.items||[]).map(x=>`<div class="track"><span>♪</span><img src="${x.thumbnail||''}"><b>${x.title}<small>${x.artist||''} • ${x.category||''}</small></b><em>${x.youtubeId?'YOUTUBE':''}</em></div>`).join('')}load()</script></body></html>
