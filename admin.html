<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zubeen Radio — Admin</title><style>
body{margin:0;background:#120c0a;color:#eee5de;font:14px system-ui}.wrap{max-width:1050px;margin:auto;padding:34px 20px}.card{background:#211510;border:1px solid #493126;border-radius:18px;padding:22px;margin-bottom:16px}h1,h2{font-family:Georgia,serif;font-weight:500}label{display:block;color:#a99487;font-size:11px;margin:12px 0}input,select{width:100%;padding:11px;border-radius:9px;border:1px solid #51372a;background:#140e0b;color:#fff;box-sizing:border-box;margin-top:6px}button{background:#d9a565;border:0;padding:10px 15px;border-radius:10px;font-weight:700;cursor:pointer}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.results{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.result{border:1px solid #493126;border-radius:12px;padding:10px;background:#17100d;display:grid;grid-template-columns:150px 1fr;gap:12px}.result img{width:150px;height:84px;object-fit:cover;border-radius:8px}.result b{font-size:13px}.result small,.item small{display:block;color:#8e7c72;margin-top:5px}.item{padding:12px 0;border-bottom:1px solid #34231c;display:flex;justify-content:space-between;gap:10px}.danger{background:#5a3a2c;color:#fff}.msg{margin-top:12px;color:#caa88c;min-height:18px}@media(max-width:700px){.row,.results{grid-template-columns:1fr}.result{grid-template-columns:110px 1fr}.result img{width:110px;height:62px}}
</style></head><body><div class="wrap"><a href="/" style="color:#d9a565;text-decoration:none">← Back to Radio</a><h1>Zubeen Radio — YouTube Catalog</h1>
<div class="card"><h2>1. Search YouTube</h2><p style="color:#a99487">Server-side YouTube Data API v3 search. Only public + embeddable results are shown.</p><div class="row"><label>Search song / artist<input id="q" value="Zubeen Garg Assamese songs" placeholder="Zubeen Garg Phoolate Bohagare"></label><label>Rotation<select id="cat"><option>Borgeet, Lokgeet & Bhakti</option><option>Bihu & High Energy</option><option>Assamese Modern Classics</option><option>Bollywood Nostalgia</option><option>Midnight Melodies</option></select></label></div><button onclick="searchYT()">Search YouTube</button><div id="msg" class="msg"></div><div id="results" class="results" style="margin-top:14px"></div></div>
<div class="card"><h2>2. Current Radio Catalog</h2><div id="list">Loading...</div></div></div>
<script>
async function searchYT(){const q=document.getElementById('q').value.trim();const out=document.getElementById('results');const msg=document.getElementById('msg');if(!q)return;out.innerHTML='Searching...';msg.textContent='';try{const r=await fetch('/api/youtube/search?q='+encodeURIComponent(q));const d=await r.json();if(!r.ok)throw new Error(d.error||'Search failed');out.innerHTML=(d.items||[]).map(x=>`<div class="result"><img src="${x.thumbnail}" alt=""><div><b>${escapeHtml(x.title)}</b><small>${escapeHtml(x.channelTitle)}</small><small>ID: ${x.id}</small><button style="margin-top:10px" onclick='addSong(${JSON.stringify(x).replace(/'/g,"&#39;")})'>Add to Radio</button></div></div>`).join('')||'<p>No embeddable results.</p>'}catch(e){out.innerHTML='';msg.textContent=e.message}}
async function addSong(x){const category=document.getElementById('cat').value;const r=await fetch('/api/admin/songs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:x.title,artist:x.channelTitle,year:(x.publishedAt||'').slice(0,4)||'—',category,youtubeId:x.id,thumbnail:x.thumbnail})});const d=await r.json();document.getElementById('msg').textContent=r.ok?'Song added to the server catalog.':'Error: '+(d.error||'Could not add');load()}
async function removeSong(id){if(!confirm('Remove this song?'))return;await fetch('/api/admin/songs/'+encodeURIComponent(id),{method:'DELETE'});load()}
async function load(){const r=await fetch('/api/admin/songs');const d=await r.json();document.getElementById('list').innerHTML=(d.items||[]).map(x=>`<div class="item"><div><b>${escapeHtml(x.title)}</b><small>${escapeHtml(x.artist)} · ${escapeHtml(x.category)} · ${x.youtubeId||'NO VIDEO'}</small></div><button class="danger" onclick="removeSong('${x.id}')">Remove</button></div>`).join('')||'<p style="color:#8e7c72">No songs added yet.</p>'}
function escapeHtml(s){return String(s||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}load();
</script></body></html>
