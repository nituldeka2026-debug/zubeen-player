<!doctype html><html lang="as"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zubeen Radio — Admin</title><link rel="manifest" href="/manifest.webmanifest"><link rel="stylesheet" href="/style.css"></head><body><div class="bg"></div><div class="shade"></div><main class="admin-wrap"><a href="/" class="admin-back">← RADIO</a><div class="admin-head"><div><span class="kicker">STATION CONTROL</span><h1>Radio Admin</h1><p>Catalogue, rotation and schedule management.</p></div><button id="syncAll" class="admin-btn">SYNC ALL PROGRAMS</button></div><div id="health" class="strip">Loading…</div><section class="admin-card"><h2>Add / Update Song</h2><div class="form-grid"><input id="sid" type="hidden"><label>Title<input id="title" placeholder="Song title"></label><label>Artist<input id="artist" value="Zubeen Garg"></label><label>Year<input id="year" placeholder="2006"></label><label>Category<select id="category"></select></label><label>YouTube ID<input id="youtubeId" placeholder="Video ID"></label><label>Direct audio URL<input id="audioUrl" placeholder="https://…mp3"></label><label>Thumbnail URL<input id="thumbnail" placeholder="https://…jpg"></label><label>Duration (sec)<input id="duration" type="number" min="0" placeholder="0"></label></div><div class="form-actions"><button id="save" class="admin-btn">SAVE SONG</button><button id="reset" class="admin-btn ghost">CLEAR</button></div><p class="admin-note">Direct audio URLs are the preferred source when you need dependable mobile background playback. Use only audio you are licensed to stream.</p></section><section class="admin-card"><div class="section-head"><div><span class="kicker">CATALOGUE</span><h2>All Songs</h2></div><input id="filter" class="filter" placeholder="Search title / category"></div><div id="songs"></div></section><section class="admin-card"><div class="section-head"><div><span class="kicker">PROGRAM CLOCK</span><h2>Schedule</h2></div><button id="saveSchedule" class="admin-btn">SAVE SCHEDULE</button></div><div id="schedule"></div></section><div id="notice" class="notice"></div></main><script>
const $=id=>document.getElementById(id);let items=[],schedule=[],adminKey=localStorage.getItem('zubeen_admin_key')||'';const headers=()=>adminKey?{'Content-Type':'application/json','x-admin-key':adminKey}:{'Content-Type':'application/json'};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function note(t,ok=false){$('notice').textContent=t;$('notice').className='notice '+(ok?'ok':'')}
async function api(url,opt={}){opt.headers={...(opt.headers||{}),...(opt.body?headers():adminKey?{'x-admin-key':adminKey}:{})};const r=await fetch(url,opt);const d=await r.json();if(r.status===401){adminKey=prompt('Enter ADMIN_KEY (leave blank if admin is not protected):')||'';localStorage.setItem('zubeen_admin_key',adminKey);throw new Error('Please press the button again after entering the key.')}if(!r.ok)throw new Error(d.error||'Request failed');return d}
function fillCats(){const cats=[...new Set(schedule.map(x=>x.name))];$('category').innerHTML=cats.map(x=>`<option>${esc(x)}</option>`).join('')}
function renderSongs(){const q=$('filter').value.toLowerCase();$('songs').innerHTML=items.filter(x=>`${x.title} ${x.artist} ${x.category}`.toLowerCase().includes(q)).map(x=>`<div class="admin-song"><img src="${esc(x.thumbnail||'/icon.svg')}" onerror="this.src='/icon.svg'"><div><b>${esc(x.title)}</b><small>${esc(x.artist)} • ${esc(x.category)} • ${x.youtubeId?'YouTube':x.audioUrl?'Direct audio':'No source'}</small></div><span class="song-status ${x.enabled===false?'off':''}">${x.enabled===false?'OFF':'ON'}</span><button onclick="editSong('${x.id}')">EDIT</button><button onclick="toggleSong('${x.id}')">${x.enabled===false?'ENABLE':'DISABLE'}</button><button onclick="deleteSong('${x.id}')">DELETE</button></div>`).join('')||'<div class="empty">No songs found.</div>'}
window.editSong=id=>{const x=items.find(s=>s.id===id);if(!x)return;$('sid').value=x.id;$('title').value=x.title||'';$('artist').value=x.artist||'';$('year').value=x.year||'';$('category').value=x.category||schedule[0]?.name||'';$('youtubeId').value=x.youtubeId||'';$('audioUrl').value=x.audioUrl||'';$('thumbnail').value=x.thumbnail||'';$('duration').value=x.duration||0;scrollTo({top:0,behavior:'smooth'})};
window.toggleSong=async id=>{const x=items.find(s=>s.id===id);try{await api('/api/admin/songs/'+id,{method:'PUT',body:JSON.stringify({...x,enabled:x.enabled===false})});await load();note('Song status updated.',true)}catch(e){note(e.message)}};
window.deleteSong=async id=>{if(!confirm('Delete this song from the catalogue?'))return;try{await api('/api/admin/songs/'+id,{method:'DELETE'});await load();note('Song deleted.',true)}catch(e){note(e.message)}};
async function load(){try{const [h,s,c]=await Promise.all([api('/api/health'),api('/api/admin/songs'),api('/api/schedule')]);$('health').innerHTML=`YouTube API: <b>${h.youtubeConfigured?'ON':'OFF'}</b> · Admin protection: <b>${h.adminProtected?'ON':'OFF'}</b> · Songs: <b>${h.catalogCount}</b> · Listeners: <b>${h.listeners}</b>`;items=s.items||[];schedule=c.items||[];fillCats();renderSongs();renderSchedule()}catch(e){note(e.message)}}
function renderSchedule(){$('schedule').innerHTML=schedule.map((x,i)=>`<div class="schedule-edit"><input data-k="name" data-i="${i}" value="${esc(x.name)}"><input data-k="start" data-i="${i}" value="${esc(x.start)}" type="time"><input data-k="end" data-i="${i}" value="${esc(x.end)}" type="time"><input data-k="query" data-i="${i}" value="${esc(x.query||'')}" placeholder="YouTube search query"><label><input data-k="enabled" data-i="${i}" type="checkbox" ${x.enabled!==false?'checked':''}> ON</label></div>`).join('')}
$('save').onclick=async()=>{try{const payload={title:$('title').value,artist:$('artist').value,year:$('year').value,category:$('category').value,youtubeId:$('youtubeId').value,audioUrl:$('audioUrl').value,thumbnail:$('thumbnail').value,duration:$('duration').value,enabled:true};if($('sid').value)await api('/api/admin/songs/'+$('sid').value,{method:'PUT',body:JSON.stringify(payload)});else await api('/api/admin/songs',{method:'POST',body:JSON.stringify(payload)});$('reset').click();await load();note('Song saved.',true)}catch(e){note(e.message)}};
$('reset').onclick=()=>{['sid','title','year','youtubeId','audioUrl','thumbnail','duration'].forEach(id=>$(id).value='');$('artist').value='Zubeen Garg';if(schedule[0])$('category').value=schedule[0].name};$('filter').oninput=renderSongs;
$('syncAll').onclick=async()=>{try{const d=await api('/api/admin/sync',{method:'POST',body:'{}'});await load();note(`Sync complete. ${d.results.reduce((n,x)=>n+(x.added||0),0)} new songs added.`,true)}catch(e){note(e.message)}};
$('saveSchedule').onclick=async()=>{try{const out=schedule.map((x,i)=>{const q=k=>document.querySelector(`[data-k="${k}"][data-i="${i}"]`);return{...x,name:q('name').value,start:q('start').value,end:q('end').value,query:q('query').value,enabled:q('enabled').checked}});const d=await api('/api/admin/schedule',{method:'PUT',body:JSON.stringify({items:out})});schedule=d.items;fillCats();renderSchedule();note('Schedule saved.',true)}catch(e){note(e.message)}};
load();
</script></body></html>
