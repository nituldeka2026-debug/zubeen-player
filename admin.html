<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zubeen Radio — Admin</title><style>body{margin:0;background:#120c0a;color:#eee5de;font:13px system-ui}.wrap{max-width:900px;margin:auto;padding:40px 20px}.card{background:#211510;border:1px solid #493126;border-radius:18px;padding:22px;margin-bottom:16px}h1,h2{font-family:Georgia,serif;font-weight:500}label{display:block;color:#a99487;font-size:11px;margin:12px 0}input,select{width:100%;padding:11px;border-radius:9px;border:1px solid #51372a;background:#140e0b;color:#fff;box-sizing:border-box;margin-top:6px}button{background:#d9a565;border:0;padding:11px 16px;border-radius:10px;font-weight:700;cursor:pointer}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.item{padding:12px 0;border-bottom:1px solid #34231c;display:flex;justify-content:space-between;gap:10px}.item small{display:block;color:#8e7c72}@media(max-width:600px){.row{grid-template-columns:1fr}}</style></head><body><div class="wrap"><a href="/" style="color:#d9a565;text-decoration:none">← Back to Radio</a><h1>Zubeen Radio — Catalog Admin</h1><div class="card"><p style="color:#a99487">Add a YouTube Video ID for an official/embeddable video. The player uses YouTube's official embed/player; it does not extract MP3.</p><div class="row"><label>Song title<input id="title" placeholder="Phoolate Bohagare"></label><label>Artist<input id="artist" value="Zubeen Garg"></label><label>Year<input id="year" placeholder="2022"></label><label>Rotation<select id="cat"><option>Borgeet, Lokgeet & Bhakti</option><option>Bihu & High Energy</option><option>Assamese Modern Classics</option><option>Bollywood Nostalgia</option><option>Midnight Melodies</option></select></label><label>YouTube Video ID<input id="yt" placeholder="Example: dQw4w9WgXcQ"></label><label>Thumbnail URL (optional)<input id="thumb" placeholder="https://..."></label></div><button onclick="save()">Save Song</button> <button onclick="resetAll()" style="background:#5a3a2c;color:#fff">Reset</button><div id="msg" style="margin-top:12px;color:#caa88c"></div></div><div class="card"><h2>Catalog</h2><div id="list"></div></div></div><script>function get(){try{return JSON.parse(localStorage.getItem('zubeen_songs'))||[]}catch{return[]}}function render(){const s=get();document.getElementById('list').innerHTML=s.length?s.map(x=>`<div class="item"><div><b>${x.title}</b><small>${x.artist} · ${x.year} · ${x.category}</small></div><small>${x.youtubeId||'NO YOUTUBE ID'}</small></div>`).join(''):'<p style="color:#8e7c72">No catalog entries yet.</p>'}function save(){const title=document.getElementById('title').value.trim(),yt=document.getElementById('yt').value.trim();if(!title||!yt){document.getElementById('msg').textContent='Title and YouTube Video ID are required.';return}const s=get();s.push({id:Date.now(),title,artist:document.getElementById('artist').value.trim()||'Zubeen Garg',year:document.getElementById('year').value.trim()||'—',category:document.getElementById('cat').value, youtubeId:yt,thumbnail:document.getElementById('thumb').value.trim()});localStorage.setItem('zubeen_songs',JSON.stringify(s));document.getElementById('msg').textContent='Song saved. Open Radio to test it.';render()}function resetAll(){localStorage.removeItem('zubeen_songs');document.getElementById('msg').textContent='Catalog reset. Reload Radio.';render()}render();</script></body></html>
